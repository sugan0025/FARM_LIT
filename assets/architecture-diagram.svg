  <g transform="translate(745, 80)">
    <rect width="230" height="230" rx="12" fill="url(#farmCardBg)" stroke="url(#fb4)" stroke-width="1.5"/>
    <rect x="14" y="14" width="32" height="32" rx="8" fill="#c084fc" fill-opacity="0.15"/>
    <text x="30" y="36" font-size="18" text-anchor="middle">📈</text>
    <text x="54" y="28" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#d8b4fe">Attribution &amp; SEO</text>
