    <text x="54" y="42" font-family="'Segoe UI', sans-serif" font-size="10" fill="#a7f3d0">Next.js 14 App Router</text>

    <line x1="14" y1="56" x2="211" y2="56" stroke="#4ade80" stroke-opacity="0.2" stroke-width="1"/>

    <text x="14" y="78" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E2E8F0">• Tailwind Natural Design</text>
    <text x="14" y="102" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E2E8F0">• Centered Cart Modal</text>
