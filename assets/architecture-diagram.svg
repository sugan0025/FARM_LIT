    <text x="14" y="150" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E2E8F0">• Faceted Category Search</text>
    <text x="14" y="174" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E2E8F0">• Responsive Next/Image</text>
