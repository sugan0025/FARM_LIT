    <text x="14" y="174" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E2E8F0">• Playwright E2E Test Suite</text>
    <text x="14" y="200" font-family="'Segoe UI', sans-serif" font-size="10" fill="#d8b4fe">→ Maximum ROAS &amp; Rank</text>
